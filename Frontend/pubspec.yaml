name: roadsos
description: RoadSoS — Offline-First Emergency Response for the Golden Hour.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────────
  # hooks_riverpod re-exports flutter_riverpod. Do NOT add flutter_riverpod separately.
  riverpod: any
  riverpod_annotation: any
  hooks_riverpod: any
  freezed_annotation: any

  # ── Navigation ────────────────────────────────────────────────────────────────
  go_router: ^13.0.0

  # ── Network ───────────────────────────────────────────────────────────────────
  dio: ^5.4.3
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.3.1
  # Gap 7: internet_connection_checker_plus for REAL reachability probing.
  # connectivity_plus only checks whether a network interface is UP (not internet).
  # A captive portal WiFi returns 'connected' but all API calls fail.
  # CRITICAL for SOS path — we must not route away from offline queue on false positive.
  internet_connection_checker_plus: ^3.0.1

  # ── WebSocket ─────────────────────────────────────────────────────────────────
  web_socket_channel: ^3.0.0

  # ── Local Persistence ─────────────────────────────────────────────────────────
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Maps ──────────────────────────────────────────────────────────────────────
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # ── Location & Sensors ────────────────────────────────────────────────────────
  geolocator: ^12.0.0
  # Gap 1: sensors_plus needed for F-001 auto-detect (accelerometer > 8G dialog).
  # Phase 1 ships the dialog stub. Full sensor fusion (gyroscope + barometer) in Phase 3C.
  sensors_plus: ^4.0.2
  # Gap 2: background_locator_2 — ADD IN PHASE 2 ONLY for volunteer foreground service.
  # Do NOT uncomment until Phase 2 implementation begins.
  # background_locator_2: ^2.0.6

  # ── Network Connectivity (interface state) ────────────────────────────────────
  # Use this for showing WiFi/mobile icon in UI only.
  # Use internet_connection_checker_plus for actual internet access checks.
  connectivity_plus: ^5.0.0

  # ── Push Notifications ────────────────────────────────────────────────────────
  # Gap 4: Requires google-services.json (Android) and GoogleService-Info.plist (iOS).
  # Download from Firebase Console before building. App crashes at startup without them.
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0

  # ── Auth & Security ───────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.2.0

  # ── UI & Icons ────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  wakelock_plus: ^1.2.0

  # ── Utilities ─────────────────────────────────────────────────────────────────
  json_annotation: ^4.8.1
  package_info_plus: ^8.0.0
  device_info_plus: ^10.0.0
  permission_handler: ^11.3.0
  url_launcher: ^6.2.0
  crypto: ^3.0.3

  # ── Phase 2 additions (commented out — add when Phase 2 work begins) ──────────
  # flutter_sound: ^9.0.0         # Voice SOS full implementation
  # speech_to_text: ^6.0.0        # On-device transcription fallback
  # Phase 3 additions:
  # flutter_blue_plus: ^1.31.0    # BLE Mesh Relay

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  build_runner: any
  freezed: any
  json_serializable: ^6.7.1
  retrofit_generator: ^10.2.6
  riverpod_generator: any
  drift_dev: any

flutter:
  uses-material-design: true
  # Assets added incrementally as features are implemented.
  # assets:
  #   - assets/images/
  #   - assets/icons/
